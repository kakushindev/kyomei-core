# Host nginx on the VPS: forwards kyomei-core.asqara.tech to the kyomei-web container.
#
#   Cloudflare → Tunnel (cloudflared) → http://localhost:80 (this file) → 127.0.0.1:8080 (container)
#
# Install (Debian/Ubuntu layout):
#   sudo cp deploy/nginx/kyomei-core.asqara.tech.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/kyomei-core.asqara.tech.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The container sets the cache and security headers itself; this block only passes requests on.
# Port 80 is reached by cloudflared on the same machine; keep it closed in the firewall.

server {
    listen 80;
    listen [::]:80;
    server_name kyomei-core.asqara.tech;

    access_log /var/log/nginx/kyomei-core.access.log;
    error_log  /var/log/nginx/kyomei-core.error.log warn;

    # A static site: no request bodies.
    client_max_body_size 1k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Cloudflare's visitor address, passed through for the container's logs.
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
