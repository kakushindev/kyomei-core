# Kyōmei landing page, served by nginx inside the website container (see ../Dockerfile).
# Replaces the image's /etc/nginx/conf.d/default.conf, so it sits in the http {} context.
# The container listens on 8080 as an unprivileged user; publish it on the host's loopback only
# (127.0.0.1:8080) and let the existing Cloudflare Tunnel reach it. See docs/DEPLOYMENT.md.

# Cache policy by path: hashed build assets forever, other static files for a day, HTML always
# revalidated so a new image shows up immediately.
map $uri $kyomei_cache_control {
    ~^/_assets/                                    "public, max-age=31536000, immutable";
    ~\.(?:png|svg|ico|webmanifest|woff2?|xml|txt)$ "public, max-age=86400";
    default                                        "no-cache";
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;
    charset utf-8;

    # Requests reach the container from cloudflared through Docker's bridge, so the visitor's
    # address comes from Cloudflare's header, trusted only from loopback and private networks.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # A static site: nothing to POST to.
    if ($request_method !~ ^(?:GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml
               text/plain application/manifest+json;

    # Headers live at server level only: an add_header inside a location would drop all of these.
    add_header Cache-Control $kyomei_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Scripts and styles are files from this origin only (scripts/check-dist.mjs enforces it). The
    # one outside connection is the public GitHub Releases API, with no token. Style attributes are
    # allowed for a few layout values set in markup.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;

    # No dotfiles, whatever ends up in the build.
    location ~ /\. {
        return 404;
    }

    location / {
        # Real files only. No single-page-app fallback: unknown paths are a 404.
        try_files $uri $uri/ $uri.html =404;
    }

    # For the container health check; not logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
